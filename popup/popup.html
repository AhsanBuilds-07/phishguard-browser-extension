<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <title>SentinelAI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Header -->
    <header class="hd" data-r>
      <div class="hd-mark">
        <span class="wordmark">SENTINEL<span class="wordmark-slash">/</span>AI</span>
        <span class="hd-meta"><span id="model-version">rf-local</span> &middot; on-device</span>
      </div>
      <span class="status-chip" id="status-chip" title="Navigation guard is running">
        <i class="status-led"></i><span id="status-chip-text">ARMED</span>
      </span>
    </header>

    <!-- Target -->
    <section class="target" data-r>
      <div class="target-row">
        <span class="label">Target</span>
        <span class="proto" id="protocol">HTTPS</span>
      </div>
      <h1 class="host" id="host">resolving&hellip;</h1>
      <p class="path" id="path">&mdash;</p>
      <p class="impersonation hidden" id="impersonation">
        Mimics <strong id="brand-name"></strong>
      </p>
    </section>

    <!-- Verdict + score (asymmetric split) -->
    <section class="verdict" data-r>
      <div class="verdict-main">
        <span class="label">Verdict</span>
        <span class="verdict-word" id="verdict-word" data-tone="idle">SCANNING</span>
        <p class="verdict-summary" id="summary">Evaluating heuristics and local model inference.</p>
      </div>
      <div class="verdict-score">
        <span class="label label-right">Risk</span>
        <span class="score"><span id="score">--</span><small>/100</small></span>
        <span class="confidence" id="confidence">conf --</span>
      </div>
    </section>

    <!-- Probability ticks -->
    <section class="ticks-block" data-r aria-label="Model probability split">
      <div class="ticks" id="ticks" role="img" aria-label="Phishing probability"></div>
      <div class="ticks-legend">
        <span>benign <b id="p-benign">--</b></span>
        <span>phishing <b id="p-phish">--</b></span>
      </div>
    </section>

    <!-- Command zone -->
    <section class="cmd" data-r>
      <div class="seg" id="seg" role="radiogroup" aria-label="Domain policy">
        <span class="seg-thumb" aria-hidden="true"></span>
        <button class="seg-opt" role="radio" data-mode="guard" aria-checked="true">
          <span class="seg-key">G</span>Guard
        </button>
        <button class="seg-opt" role="radio" data-mode="trust" aria-checked="false">
          <span class="seg-key">T</span>Trust
        </button>
      </div>
      <button class="trigger" id="btn-rescan" type="button" title="Re-run analysis on this tab (R)">
        <span class="trigger-glyph" id="rescan-glyph" aria-hidden="true">&#8635;</span>
        <span>Rescan</span>
      </button>
    </section>

    <!-- Evidence -->
    <section class="evidence" data-r>
      <header class="sec-hd">
        <h2>Evidence</h2>
        <span class="sec-count" id="evidence-count">00</span>
      </header>
      <ol class="evidence-list" id="evidence-list"></ol>
    </section>

    <!-- Log -->
    <section class="log" data-r>
      <header class="sec-hd">
        <h2>Recent</h2>
        <span class="log-stats" id="log-stats">&mdash;</span>
      </header>
      <table class="log-table">
        <tbody id="log-body"></tbody>
      </table>
    </section>

    <!-- Footer -->
    <footer class="ft" data-r>
      <button class="ft-link" id="btn-console" type="button">
        Command center <span class="ft-arrow" aria-hidden="true">&#8599;</span>
      </button>
      <span class="ft-note">Zero history leaves this device</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
